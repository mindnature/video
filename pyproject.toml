[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solo-ai-video-studio"
version = "1.4.0"
description = "Local-first shot-based AI video production pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "mindnature"}]
dependencies = []

[project.optional-dependencies]
flow = ["playwright>=1.50,<2"]

[project.scripts]
video-studio = "videostudio.cli:main"

[tool.setuptools.packages.find]
include = ["videostudio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
